name: Build Mod

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 自动补齐 gradlew
        run: |
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          unzip -q forge-1.12.2-14.23.5.2860-mdk.zip -d mdk
          if [ ! -f gradlew ]; then cp mdk/gradlew mdk/gradlew.bat .; fi
          if [ ! -d gradle ]; then cp -r mdk/gradle .; fi
          chmod +x gradlew

      - name: 编译
        run: ./gradlew build --no-daemon

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
